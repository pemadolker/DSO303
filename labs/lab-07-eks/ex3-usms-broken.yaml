apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-broken
  namespace: usms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usms-broken
  template:
    metadata:
      labels:
        app: usms-broken
        version: v1
    spec:
      containers:
        - name: broken
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: usms-broken
  namespace: usms
spec:
  selector:
    app: usms-broken
    version: v1
  ports:
    - port: 80
      targetPort: http
